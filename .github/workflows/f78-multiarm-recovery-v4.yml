name: F78 Multiarm Recovery V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'simulation/f78_multiarm_recovery_v4.py'
      - '.github/workflows/f78-multiarm-recovery-v4.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V3-preserving V4 recovery comparison
        run: python simulation/f78_multiarm_recovery_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f78-multiarm-recovery-v4
          path: out/*.json
          retention-days: 14
