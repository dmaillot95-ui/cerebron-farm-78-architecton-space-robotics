name: F78 multiarm ARCHITECTON V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'simulation/f78_multiarm_architecton.py'
      - '.github/workflows/f78-multiarm-architecton-canary.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run second-generation simulation
        run: python simulation/f78_multiarm_architecton.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f78-multiarm-architecton
          path: out/*.json
          retention-days: 14
